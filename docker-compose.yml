services:
  db:
    image: postgres:16-alpine
    container_name: ciphertrace-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciphertrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciphertrace_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ciphertrace_db}
    ports:
      # 5434 en el host para evitar conflictos con otros PostgreSQL locales.
      # El backend usa "db:5432" dentro de la red de Compose.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphertrace -d ciphertrace_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ciphertrace-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ciphertrace-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      DATABASE_URL: postgresql://ciphertrace:ciphertrace_pass@db:5432/ciphertrace_db
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ./backend/data/raw:/app/data/raw
    networks:
      - ciphertrace-net
    restart: unless-stopped

  backend-host:
    build:
      context: ./backend
    container_name: ciphertrace-backend-host
    profiles:
      - host-capture
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      DATABASE_URL: postgresql://ciphertrace:ciphertrace_pass@127.0.0.1:5434/ciphertrace_db
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ./backend/data/raw:/app/data/raw
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ciphertrace-frontend
    ports:
      - "5173:80"
    networks:
      - ciphertrace-net
    restart: unless-stopped

networks:
  ciphertrace-net:
    driver: bridge

volumes:
  pgdata:
